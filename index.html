<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard</title>
<meta name="theme-color" content="#070b14">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --accent:#3b82f6; --accent-rgb:59,130,246;
  --bg:#060910; --bg2:#0b1120;
  --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#f3f6fb; --muted:#9aa6b8; --dim:#6b778a;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --c-kracht:#f59e0b; --c-duur:#34d399; --c-interval:#f472b6; --c-hyrox:#a78bfa; --c-rust:#64748b; --c-laad:#22d3ee;
  --m-p:#60a5fa; --m-c:#fbbf24; --m-f:#f472b6;
  --r:20px; --r-sm:14px;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 40% at 15% -5%,rgba(var(--accent-rgb),.22),transparent 70%),
             radial-gradient(50% 35% at 100% 30%,rgba(var(--accent-rgb),.08),transparent 70%),
             radial-gradient(60% 40% at 50% 110%,rgba(167,139,250,.07),transparent 70%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(14px + var(--st)) 16px calc(96px + var(--sb))}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 16px}
.hello small{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.hello h1{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(var(--accent-rgb),.14);border:1px solid rgba(var(--accent-rgb),.35);font-size:.78rem;font-weight:700;white-space:nowrap}
.pill b{font-size:1rem;font-variant-numeric:tabular-nums}

/* views */
.view{display:none;animation:fade .35s var(--ease)}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:22px 4px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec .est{letter-spacing:.04em}

/* cards */
.card{background:linear-gradient(160deg,var(--glass2),var(--glass));border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);margin-bottom:12px}
.card h3{font-size:1rem;font-weight:750;letter-spacing:-.01em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.8rem}
.note{font-size:.78rem;color:var(--muted);margin-top:10px}
.est{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);padding:2px 7px;border-radius:999px;vertical-align:middle}

/* hero */
.hero{position:relative;overflow:hidden;padding:18px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(var(--accent-rgb),.35),transparent 70%);pointer-events:none}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;position:relative;z-index:1}
.big{font-size:3.4rem;font-weight:850;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.big.txt{font-size:2.4rem}
.big span{font-size:1rem;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:4px}
.hero .lbl{font-size:.75rem;color:var(--muted);font-weight:600}
.hero .race{text-align:right;max-width:52%;font-size:.82rem;color:var(--muted)}
.hero .race b{display:block;color:var(--text);font-size:.95rem}

/* type chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--tc) 18%,transparent);color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 40%,transparent)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc)}
.tag{display:inline-block;font-size:.7rem;font-weight:600;color:var(--muted);padding:3px 8px;border-radius:999px;background:var(--glass2);border:1px solid var(--line)}
.rpe-tag{font-weight:800}
.t-kracht{--tc:var(--c-kracht)} .t-duur{--tc:var(--c-duur)} .t-interval{--tc:var(--c-interval)} .t-hyrox{--tc:var(--c-hyrox)} .t-rust{--tc:var(--c-rust)} .t-laad{--tc:var(--c-laad)}
.t-normaal{--tc:var(--accent)} .t-race{--tc:var(--bad)}

/* session */
.sess{padding:0;overflow:hidden;border-left:3px solid var(--tc)}
.sess-head{display:flex;gap:12px;align-items:center;padding:14px 14px 14px 14px;cursor:pointer}
.sess-day{flex:0 0 46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc);font-weight:850;font-size:.8rem;text-transform:uppercase;line-height:1.05;text-align:center}
.sess-day span{display:block;font-size:1.05rem;color:var(--text)}
.sess-main{flex:1;min-width:0}
.sess-name{font-weight:750;font-size:.98rem;letter-spacing:-.01em}
.sess-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chev{width:20px;height:20px;color:var(--dim);transition:transform .3s var(--ease);flex:0 0 auto}
.sess.open .chev{transform:rotate(180deg)}
.sess-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.sess.open .sess-body{grid-template-rows:1fr}
.sess-body>div{overflow:hidden}
.sess-inner{padding:0 14px 16px}
.sess.today-card .sess-body{grid-template-rows:1fr}
ul.det{list-style:none;display:grid;gap:7px;margin:2px 0 14px}
ul.det li{position:relative;padding-left:18px;font-size:.88rem;color:#d6dde8}
ul.det li::before{content:"";position:absolute;left:4px;top:.55em;width:6px;height:6px;border-radius:2px;background:var(--tc)}
.sess.done{opacity:.72}
.sess.done .sess-name{text-decoration:line-through;text-decoration-color:var(--dim)}
.tick{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;transition:all .2s var(--ease)}
.tick svg{width:18px;height:18px;opacity:0;transform:scale(.6);transition:all .2s var(--ease)}
.tick.on{background:var(--ok);border-color:var(--ok);color:#03130c}
.tick.on svg{opacity:1;transform:none}

.bigbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:16px;font-weight:800;font-size:1.05rem;background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(var(--accent-rgb),.4);transition:transform .15s var(--ease),background .2s}
.bigbtn:active{transform:scale(.98)}
.bigbtn.on{background:var(--ok);color:#03130c;box-shadow:0 8px 24px rgba(52,211,153,.3)}
.bigbtn svg{width:22px;height:22px}

.lab{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 7px}
.rpe-row{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe-row button{height:34px;border-radius:9px;background:var(--glass2);border:1px solid var(--line);font-weight:750;font-size:.85rem;transition:all .15s}
.rpe-row button.on{background:var(--rc);border-color:var(--rc);color:#0b0f17}
textarea{width:100%;min-height:62px;resize:vertical;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem;outline:none}
textarea:focus,input:focus{border-color:rgba(var(--accent-rgb),.6)}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.strip button{min-width:0;overflow:hidden}
.strip .lb{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--tc);letter-spacing:.02em}
.strip button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:14px;background:color-mix(in srgb,var(--tc) 14%,transparent);border:1px solid color-mix(in srgb,var(--tc) 30%,transparent);transition:transform .15s}
.strip button:active{transform:scale(.95)}
.strip .d{font-size:.66rem;font-weight:800;text-transform:uppercase;color:var(--tc)}
.strip .n{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums}
.strip .s{width:16px;height:16px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--tc) 60%,transparent);display:grid;place-items:center}
.strip .s.on{background:var(--ok);border-color:var(--ok)}
.strip .s.on::after{content:"";width:6px;height:3px;border-left:2px solid #03130c;border-bottom:2px solid #03130c;transform:rotate(-45deg) translate(1px,-1px)}
.strip .today{outline:2px solid var(--text);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#a78bfa));transition:width .5s var(--ease)}
.bar.warn>i{background:linear-gradient(90deg,var(--warn),var(--bad))}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.num{font-weight:850;font-variant-numeric:tabular-nums}

/* nutrition */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{padding:9px 4px;border-radius:10px;font-size:.8rem;font-weight:750;color:var(--muted);transition:all .2s}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(var(--accent-rgb),.35)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.ring{position:relative;width:88px;height:88px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.07)}
.ring .fg{transition:stroke-dashoffset .6s var(--ease)}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;line-height:1.05}
.ring .v b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.ring .v small{font-size:.66rem;color:var(--muted)}
.rings .nm{font-size:.75rem;font-weight:700;margin-top:6px}
.kcalrow{margin-top:14px}
.meal{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0;padding-top:2px}
.meal .tick{margin-top:2px}
.meal-main{flex:1;min-width:0}
.meal-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.meal-t b{font-size:.95rem}
.meal-t .kc{font-size:.8rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.meal-items{font-size:.84rem;color:#cdd5e1;margin-top:2px}
.meal-m{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:7px;font-size:.72rem;font-weight:700;color:var(--muted)}
.meal-m i{font-style:normal}
.meal-m .p{color:var(--m-p)} .meal-m .c{color:var(--m-c)} .meal-m .f{color:var(--m-f)}
.swap{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(var(--accent-rgb),.15);color:var(--accent);border:1px solid rgba(var(--accent-rgb),.35)}
.swap svg{width:13px;height:13px}
.meal.done .meal-items,.meal.done .meal-t b{opacity:.55;text-decoration:line-through;text-decoration-color:var(--dim)}
.plan-notes{list-style:none;display:grid;gap:6px;margin-top:6px}
.plan-notes li{font-size:.82rem;color:var(--muted);padding-left:16px;position:relative}
.plan-notes li::before{content:"!";position:absolute;left:0;color:var(--warn);font-weight:900}
.empty{text-align:center;padding:18px 8px;color:var(--muted);font-size:.88rem}

.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld label{display:block;font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.fld input,.fld select{width:100%;padding:11px 12px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);outline:none;font-size:1rem;font-weight:650;appearance:none;-webkit-appearance:none}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.res>div{padding:10px 8px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line);text-align:center}
.res b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.res span{font-size:.68rem;color:var(--muted);font-weight:650}
.res .wide{grid-column:span 3;display:flex;justify-content:space-around;align-items:center}
.res .wide>div{text-align:center}
.res.sum b{font-size:1.05rem}
.res .wide b{font-size:1.9rem}

.shop{display:grid;gap:2px}
.shop label{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.9rem}
.shop label:last-child{border-bottom:0}
.shop input{position:absolute;opacity:0;pointer-events:none}
.shop .bx{flex:0 0 22px;height:22px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;transition:all .15s}
.shop input:checked+.bx{background:var(--ok);border-color:var(--ok)}
.shop input:checked+.bx::after{content:"";width:8px;height:4px;border-left:2px solid #03130c;border-bottom:2px solid #03130c;transform:rotate(-45deg) translate(1px,-1px)}
.shop input:checked~.it{color:var(--dim);text-decoration:line-through}
.shop input:focus-visible+.bx{outline:2px solid var(--accent)}
.shop .it{flex:1}
.shop .pr{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:14px 10px;text-align:center}
.stat b{display:block;font-size:2rem;font-weight:850;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;color:var(--muted);font-weight:650}
.chart{width:100%;height:auto;display:block}
.wform{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}
.wform input{width:100%;padding:10px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);outline:none;font-size:.95rem}
.btn{padding:10px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800}
.btn.ghost{background:var(--glass2);color:var(--text);border:1px solid var(--line)}
.wlist{list-style:none;margin-top:10px;display:grid;gap:4px;font-size:.84rem}
.wlist li{display:flex;justify-content:space-between;align-items:center;color:var(--muted);padding:4px 2px}
.wlist li b{color:var(--text)}
.wlist button{color:var(--dim);font-size:1rem;padding:0 6px}
.slider{margin:6px 0 14px}
.slider .row span{font-size:.88rem;font-weight:650}
.slider .row b{font-size:1.4rem;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:30px;background:transparent;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad))}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0}
.zones{display:grid;gap:6px}
.zone{display:grid;grid-template-columns:40px 78px 1fr;gap:8px;align-items:center;padding:9px 11px;border-radius:12px;background:rgba(0,0,0,.2);border-left:4px solid var(--zc);font-size:.84rem}
.zone b{color:var(--zc);font-weight:850}
.zone .hr{font-weight:750;font-variant-numeric:tabular-nums}
.zone .use{color:var(--muted)}
.st-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.st-row:last-child{border-bottom:0}
.st-btns{display:flex;gap:6px}
.st-btns button{width:36px;height:34px;border-radius:10px;background:var(--glass2);border:1px solid var(--line);font-weight:800}
.st-btns button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.links a{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:700;font-size:.9rem}
.links a svg{width:16px;height:16px}
footer{text-align:center;font-size:.72rem;color:var(--dim);margin-top:22px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(8px + var(--sb));background:rgba(8,12,22,.78);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border-top:1px solid var(--line)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;color:var(--dim);font-size:.68rem;font-weight:750;transition:color .2s}
.tabbar button svg{width:24px;height:24px;transition:transform .2s var(--ease)}
.tabbar button.on{color:var(--accent)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.08)}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--sb));transform:translate(-50%,20px);opacity:0;background:#111a2c;border:1px solid var(--line2);padding:9px 16px;border-radius:999px;font-size:.85rem;font-weight:700;z-index:30;transition:all .3s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="hello"><small id="hdrWeek"></small><h1 id="hdrTitle">Dashboard</h1></div>
    <div class="pill" id="hdrCount"></div>
  </header>
  <main>
    <section class="view" id="v-vandaag" data-view="vandaag"></section>
    <section class="view" id="v-week" data-view="week"></section>
    <section class="view" id="v-voeding" data-view="voeding"></section>
    <section class="view" id="v-voortgang" data-view="voortgang"></section>
  </main>
  <footer id="foot"></footer>
</div>
<nav class="tabbar" aria-label="Navigatie"><div class="in">

  function intake(typeKey) {
    const tot = { kcal: 0, p: 0, c: 0, f: 0 };
    ((dt(typeKey) || {}).meals || []).forEach(m => { if (mealChecked(typeKey, m.id)) { const v = mealVariant(m); ["kcal", "p", "c", "f"].forEach(k => tot[k] += +v[k] || 0); } });
    return tot;
  }
  function ringsHTML(typeKey) {
    const tg = targetsFor(typeKey), it = intake(typeKey);
    const ring = (key, label, col, unitTarget) => {
      const pct = Math.min(1, tg[key] ? it[key] / tg[key] : 0), C2 = 2 * Math.PI * 38;
      return `<div><div class="ring"><svg viewBox="0 0 88 88"><circle class="bg" cx="44" cy="44" r="38"/><circle class="fg" cx="44" cy="44" r="38" stroke="${col}" stroke-dasharray="${C2.toFixed(1)}" stroke-dashoffset="${(C2 * (1 - pct)).toFixed(1)}"/></svg>
        <div class="v"><b>${fmt(it[key])}</b><small>/ ${unitTarget} g</small></div></div><div class="nm">${label}</div></div>`;
    };
    const kp = Math.min(100, tg.kcal ? it.kcal / tg.kcal * 100 : 0);
    return `<div class="rings">${ring("p", "Eiwit", "var(--m-p)", fmt(tg.p))}${ring("c", "Koolhydraten", "var(--m-c)", tg.cLabel || fmt(tg.c))}${ring("f", "Vet", "var(--m-f)", fmt(tg.f))}</div>
      <div class="kcalrow"><div class="row small"><span class="muted">Calorieën</span><span><b class="num">${fmt(it.kcal)}</b> <span class="muted">/ ${fmt(tg.kcal)} kcal</span></span></div><div class="bar" style="margin-top:6px"><i style="width:${kp}%"></i></div></div>`;
  }
  function mealsHTML(typeKey) {
    const d = dt(typeKey);
    if (!d || !d.meals || !d.meals.length) return `<div class="empty">Nog geen eetschema voor dit dagtype${N.by ? " — volgt van " + esc(N.by) : ""}.</div>`;
    return d.meals.map(m0 => {
      const m = mealVariant(m0), on = mealChecked(typeKey, m.id);
      const items = Array.isArray(m.items) ? m.items.join(", ") : esc(m.items);
      return `<div class="meal${on ? " done" : ""}" data-meal="${esc(m.id)}" data-type="${esc(typeKey)}">
        <button class="tick${on ? " on" : ""}" data-act="meal" aria-label="${esc(m.name)} gegeten">${ICON_CHECK}</button>
        <div class="meal-main">
          <div class="meal-t"><b>${esc(m.name)}</b><span class="kc">${fmt(m.kcal || 0)} kcal</span></div>
          <div class="meal-items">${esc(items)}</div>
          <div class="meal-m"><i class="p">E ${fmt(m.p || 0)} g</i><i class="c">K ${fmt(m.c || 0)} g</i><i class="f">V ${fmt(m.f || 0)} g</i>${m.estimate ? '<span class="est">schatting</span>' : ""}
            ${m._n ? `<button class="swap" data-act="swap">${ICON_SWAP} Ruil ${m._v + 1}/${m._n + 1}</button>` : ""}</div>
        </div></div>`;
    }).join("");
  }
  function planNotesHTML(typeKey) { const n = (dt(typeKey) || {}).notes || []; return n.length ? `<ul class="plan-notes">${n.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""; }
  function anyEstimate() { return Object.values(N.dayTypes || {}).some(d => (d.meals || []).some(m => m.estimate)); }

  /* ---------- sessiekaart ---------- */
  function sessionCard(s, opts = {}) {
    const d = sessionDate(s), done = isDone(s), lg = S.log[sKey(s)] || {};
    const rpeBtns = Array.from({ length: 10 }, (_, i) => i + 1).map(n => `<button data-act="rpe" data-n="${n}" class="${lg.rpe === n ? "on" : ""}" style="--rc:${rpeColor(n)}">${n}</button>`).join("");
    return `<article class="card sess t-${esc(s.type)}${done ? " done" : ""}${opts.today ? " today-card open" : ""}" data-sid="${esc(s.id)}" id="sess-${esc(s.id)}">
      <div class="sess-head" data-act="${opts.today ? "" : "toggle"}">
        <div class="sess-day">${esc(s.day)}<span>${d.getDate()}</span></div>
        <div class="sess-main"><div class="sess-name">${esc(s.name)}</div>
          <div class="sess-meta">${typeChip(s.type)}${(s.tags || []).filter(t => t !== s.type).map(t => `<span class="tag">${esc(t)}</span>`).join("")}<span class="tag rpe-tag" style="color:${rpeColor(s.rpe)}">RPE ${esc(s.rpe)}</span></div></div>
        ${opts.today ? "" : `<button class="tick${done ? " on" : ""}" data-act="done" aria-label="${esc(s.day)} gedaan">${ICON_CHECK}</button>${ICON_CHEV}`}
      </div>
      <div class="sess-body"><div><div class="sess-inner">
        <ul class="det">${(s.details || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        ${opts.today ? `<button class="bigbtn${done ? " on" : ""}" data-act="done">${ICON_CHECK}${done ? "Gedaan!" : "Markeer als gedaan"}</button>` : ""}
        <div class="lab">Hoe zwaar voelde het? (RPE gepland ${esc(s.rpe)})</div>
        <div class="rpe-row">${rpeBtns}</div>
        <div class="lab">Notitie</div>
        <textarea data-act="note" placeholder="Hoe ging het? Pijntjes, tijden, gevoel…">${esc(lg.note || "")}</textarea>
      </div></div></div>

  }

  /* ---------- views ---------- */
  function countdownText() {
    const n = daysToRace();

    $("#foot").textContent = (C.appTitle || "Dashboard") + " · " + C.name + " · data blijft lokaal op dit apparaat";
  }

          ${C.race ? `<div class="race"><b>${esc(C.race.name)}</b>${esc(C.race.category || "")}<br>${rd ? rd.getDate() + " " + MONTHS[rd.getMonth()] + " " + rd.getFullYear() : ""}${C.race.target ? " · " + esc(C.race.target) : ""}</div>` : ""}
        </div>

      </div>
      <div class="sec"><span>Training vandaag</span>${inWeek ? "" : `<span class="dim">schema ${esc(C.week.label || "")}</span>`}</div>

  }

  let voedType = null;
  function shopTotals() {
    const sh = N.shopping, items = sh.items || [];
    const priced = items.filter(i => typeof i.price === "number");
    const allPriced = items.length && priced.length === items.length;
    const total = allPriced ? priced.reduce((a, i) => a + i.price, 0) : (sh.statedTotal || 0);
    const checked = priced.filter(i => S.shop[sh.id + ":" + i.id]).reduce((a, i) => a + i.price, 0);
    return { total, allPriced, checked, hasPrices: priced.length > 0 };
  }
  function renderVoeding() {
    const keys = Object.keys(N.dayTypes || {});
    if (!voedType || !keys.includes(voedType)) voedType = dayTypeFor(TODAY);
    const d = dt(voedType) || {}, p = calcInput(), r = terHaaf(p), sh = N.shopping;
    const sc = N.schedule;

    if (sh) {
      const t = shopTotals(), pct = sh.budget ? Math.min(100, t.total / sh.budget * 100) : 0, nDone = (sh.items || []).filter(i => S.shop[sh.id + ":" + i.id]).length;
      shopHTML = `<div class="sec"><span>🛒 ${esc(sh.title || "Boodschappen")}</span><span class="dim">${esc([sh.store, sh.label].filter(Boolean).join(" · "))}</span></div>
      <div class="card">
        <div class="row"><span class="small muted">Budget</span><span><b class="num" style="font-size:1.3rem">${t.allPriced ? "" : "~"}${eur(t.total)}</b> <span class="muted small">/ ${eur(sh.budget || 0)}</span></span></div>
        <div class="bar${t.total > (sh.budget || Infinity) ? " warn" : ""}" style="margin-top:8px"><i style="width:${pct}%"></i></div>
        <div class="row small muted" style="margin-top:8px"><span>${nDone} / ${(sh.items || []).length} afgevinkt</span><span>${t.hasPrices ? "in mandje " + eur(t.checked) : "nog € " + fmt(Math.max(0, (sh.budget || 0) - t.total), 2) + " over"}</span></div>
        <div class="shop" style="margin-top:10px">${(sh.items || []).map(i => {
          const k = sh.id + ":" + i.id;
          return `<label><input type="checkbox" data-shop="${esc(k)}"${S.shop[k] ? " checked" : ""}><span class="bx"></span><span class="it">${esc([i.qty, i.name].filter(Boolean).join(" "))}</span>${typeof i.price === "number" ? `<span class="pr">${eur(i.price)}</span>` : ""}</label>`;
        }).join("")}</div>
        ${sh.note ? `<p class="note">${esc(sh.note)}</p>` : ""}
        <button class="btn ghost" data-act="shopreset" style="margin-top:12px;width:100%">Alle vinkjes wissen</button>
      </div>`;
    }
    $("#v-voeding").innerHTML = `
      <div class="seg" role="tablist">${keys.map(k => `<button data-act="dtype" data-k="${esc(k)}" class="${k === voedType ? "on" : ""}">${esc(dt(k).label || k)}</button>`).join("")}</div>
      <div class="sec"><span>${esc(d.emoji || "")} ${esc(d.title || voedType)}${d.when ? " · " + esc(d.when) : ""}</span><span class="dim">${esc(d.sub || "")}</span></div>
      <div class="card" data-rings="${esc(voedType)}">${ringsHTML(voedType)}${anyEstimate() ? `<p class="note"><span class="est">schatting</span> Macro's per maaltijd zijn voorlopige schattingen; exacte waarden volgen${N.by ? " van " + esc(N.by) : ""}.</p>` : ""}</div>
      <div class="card" data-meals="${esc(voedType)}">${mealsHTML(voedType)}${planNotesHTML(voedType)}</div>
      ${sc ? `<div class="card"><h3>📅 ${esc(sc.label || "Weekplan")}</h3><div class="strip">${sc.days.map((k, i) => { const dd = addDays(parseDate(sc.startDate), i); return `<button data-act="dtype" data-k="${esc(k)}" class="t-${esc(k)}${iso(dd) === TODAY_ISO ? " today" : ""}"><span class="d">${DAYS[wdIdx(dd)]}</span><span class="n">${dd.getDate()}</span><span class="lb">${esc(((dt(k) || {}).label || k).slice(0, 4))}</span></button>`; }).join("")}</div></div>` : ""}
      ${N.summary ? `<div class="card"><h3>🍽️ ${esc(N.summary.title)}</h3><div class="res sum">${(N.summary.stats || []).map(x => `<div><b>${esc(x.v)}</b><span>${esc(x.l)}</span></div>`).join("")}</div>${N.summary.note ? `<p class="note">${esc(N.summary.note)}</p>` : ""}</div>` : ""}
      <div class="sec"><span>🧮 Calculator · Ter Haaf</span></div>
      <div class="card">
        <div class="calc">
          <div class="fld"><label>Gewicht (kg)</label><input type="number" step="0.1" inputmode="decimal" data-calc="weightKg" value="${esc(p.weightKg)}"></div>

        </div>
        <div class="res" id="calcRes">${calcResHTML(r)}</div>

        <button class="btn ghost" data-act="calcreset" style="margin-top:10px;width:100%">Terug naar profiel van ${esc(C.name)}</button>
      </div>
      ${shopHTML}`;
  }
  function calcResHTML(r) {
    return `<div class="wide"><div><b>${fmt(r.kcal)}</b><span>kcal / dag</span></div><div><b style="font-size:1.25rem">${fmt(r.bmr)}</b><span>rustverbruik</span></div></div>
      <div><b style="color:var(--m-p)">${fmt(r.p)} g</b><span>eiwit</span></div><div><b style="color:var(--m-c)">${fmt(r.c)} g</b><span>koolhydraten</span></div><div><b style="color:var(--m-f)">${fmt(r.f)} g</b><span>vet</span></div>`;
  }

  function streak() {
    // aaneengesloten dagen met een afgevinkte training, t/m vandaag (of gisteren); geplande rustdagen tellen niet af
    const restDates = new Set(sessions.filter(s => s.type === "rust").map(s => iso(sessionDate(s))));
    let n = 0, d = new Date(TODAY);
    if (!S.doneDates[iso(d)]) d = addDays(d, -1);
    for (let i = 0; i < 400; i++) {
      const k = iso(d);
      if (S.doneDates[k]) n++;
      else if (!restDates.has(k)) break;
      d = addDays(d, -1);
    }
    return n;
  }
  function weightChart() {
    const w = S.weights.slice().sort((a, b) => a.date < b.date ? -1 : 1);
    if (w.length < 2) return `<div class="empty">${w.length ? "Nog één meting — voeg er meer toe voor een grafiek." : "Nog geen metingen. Profielgewicht: " + fmt((N.profile || {}).weightKg || 0, 1) + " kg."}</div>`;
    const W = 340, H = 150, pad = 26, vals = w.map(x => x.kg), mn = Math.min(...vals) - 0.5, mx = Math.max(...vals) + 0.5;
    const X = i => pad + (W - pad * 1.5) * (i / (w.length - 1)), Y = v => 12 + (H - 34) * (1 - (v - mn) / (mx - mn));
    const pts = w.map((x, i) => X(i).toFixed(1) + "," + Y(x.kg).toFixed(1)).join(" ");
    const area = `M${X(0)},${H - 22} L` + w.map((x, i) => X(i).toFixed(1) + "," + Y(x.kg).toFixed(1)).join(" L") + ` L${X(w.length - 1)},${H - 22} Z`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverloop">
      <defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="rgb(var(--accent-rgb))" stop-opacity=".35"/><stop offset="1" stop-color="rgb(var(--accent-rgb))" stop-opacity="0"/></linearGradient></defs>
      <line x1="${pad}" x2="${W}" y1="${H - 22}" y2="${H - 22}" stroke="rgba(255,255,255,.1)"/>
      <text x="0" y="${Y(mx - 0.5) + 4}" fill="#6b778a" font-size="10">${fmt(mx - 0.5, 1)}</text><text x="0" y="${Y(mn + 0.5) + 4}" fill="#6b778a" font-size="10">${fmt(mn + 0.5, 1)}</text>
      <path d="${area}" fill="url(#wg)"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      ${w.map((x, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(x.kg).toFixed(1)}" r="3.5" fill="#fff"/>`).join("")}
      <text x="${pad}" y="${H - 6}" fill="#6b778a" font-size="10">${esc(dateLabel(parseDate(w[0].date)))}</text><text x="${W}" y="${H - 6}" fill="#6b778a" font-size="10" text-anchor="end">${esc(dateLabel(parseDate(w[w.length - 1].date)))}</text></svg>`;
  }
  function renderVoortgang() {
    const done = sessions.filter(isDone).length, pct = sessions.length ? Math.round(done / sessions.length * 100) : 0;
    const total = Object.keys(S.doneDates).length;
    const w = S.weights.slice().sort((a, b) => a.date < b.date ? 1 : -1);
    $("#v-voortgang").innerHTML = `
      <div class="stats">
        <div class="card stat"><b>${pct}<small style="font-size:1rem">%</small></b><span>deze week</span></div>

        <div class="card stat"><b>${total}</b><span>trainingen totaal</span></div>
      </div>
      ${weekProgressCard()}
      <div class="sec"><span>⚖️ Gewicht</span>${w[0] ? `<span class="dim">laatst ${fmt(w[0].kg, 1)} kg</span>` : ""}</div>
      <div class="card">${weightChart()}

        ${w.length ? `<ul class="wlist">${w.slice(0, 6).map(x => `<li><span>${esc(dateLabel(parseDate(x.date)))}</span><span><b>${fmt(x.kg, 1)} kg</b> <button data-act="wdel" data-d="${esc(x.date)}" aria-label="verwijder">×</button></span></li>`).join("")}</ul>` : ""}
      </div>
      <div class="sec"><span>🦵 Knie &amp; heup (0–10)</span>${S.bodyDate ? `<span class="dim">bijgewerkt ${esc(dateLabel(parseDate(S.bodyDate)))}</span>` : ""}</div>
      <div class="card">
        ${[["knee", "Knie ongemak"], ["hip", "Heup ongemak"]].map(([k, l]) => `<div class="slider"><div class="row"><span>${l}</span><b id="${k}Val" style="color:${rpeColor(S[k] || 0)}">${S[k] || 0}</b></div><input type="range" min="0" max="10" value="${S[k] || 0}" data-body="${k}" aria-label="${l}"></div>`).join("")}
        <p class="note" style="margin-top:0">0 = niets, 10 = stoppen. Boven de 4? Pas de training aan.</p>
      </div>
      <div class="sec"><span>🎯 Station focus</span><span class="dim">1 = oké · 3 = focus</span></div>
      <div class="card">${(C.stations || []).map(st => `<div class="st-row"><span>${esc(st.name)}</span><div class="st-btns">${[1, 2, 3].map(n => `<button data-act="station" data-id="${esc(st.id)}" data-n="${n}" class="${S.stations[st.id] === n ? "on" : ""}" aria-label="Niveau ${n}">${n}</button>`).join("")}</div></div>`).join("")}
        ${C.weakStationsText ? `<p class="note">Zwakke stations: ${esc(C.weakStationsText)}</p>` : ""}</div>
      ${C.hrZones ? `<div class="sec"><span>❤️ Hartslagzones</span></div>
      <div class="card"><h3>${esc(C.hrZones.title || "Zones")}</h3><div class="zones">${(C.hrZones.zones || []).map(z => `<div class="zone" style="--zc:${esc(z.color)}"><b>${esc(z.z)}</b><span class="hr">${esc(z.hr)}</span><span class="use">${esc(z.use)}</span></div>`).join("")}</div>${C.hrZones.note ? `<p class="note">${esc(C.hrZones.note)}</p>` : ""}</div>` : ""}`;
  }

  /* ---------- tabs ---------- */
  const TABS = ["vandaag", "week", "voeding", "voortgang"];
  const RENDER = { vandaag: renderVandaag, week: renderWeek, voeding: renderVoeding, voortgang: renderVoortgang };
  let current = null;
  function show(tab, keepScroll) {
    if (!TABS.includes(tab)) tab = "vandaag";
    current = tab;
    RENDER[tab]();
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.dataset.view === tab));
    document.querySelectorAll(".tabbar button").forEach(b => { b.classList.toggle("on", b.dataset.tab === tab); b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"); });
    if (!keepScroll) window.scrollTo(0, 0);
    if (location.hash !== "#" + tab) history.replaceState(null, "", "#" + tab);
  }
  function rerender() { renderHeader(); const y = window.scrollY; RENDER[current](); window.scrollTo(0, y); }

  /* ---------- events ---------- */
  document.querySelector(".tabbar").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) show(b.dataset.tab); });
  window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (t !== current) show(t); });

  document.querySelector("main").addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el || !el.dataset.act) return;
    const act = el.dataset.act, card = el.closest("[data-sid]"), s = card && sessions.find(x => x.id === card.dataset.sid);
    if (act === "toggle" && card) { if (e.target.closest("[data-act='done']")) return; card.classList.toggle("open"); return; }
    if (act === "done" && s) { e.stopPropagation(); const v = !isDone(s); setDone(s, v); if (v) toast("Lekker bezig! 💪"); rerender(); return; }
    if (act === "rpe" && s) { const k = sKey(s), lg = S.log[k] || {}; const n = +el.dataset.n; lg.rpe = lg.rpe === n ? null : n; S.log[k] = lg; save(); card.querySelectorAll(".rpe-row button").forEach(b => b.classList.toggle("on", +b.dataset.n === lg.rpe)); return; }
    if (act === "jump") { const c = document.getElementById("sess-" + el.dataset.sid); if (c) { c.classList.add("open"); c.scrollIntoView({ behavior: "smooth", block: "start" }); } return; }
    if (act === "meal" || act === "swap") {
      const row = el.closest("[data-meal]"), tKey = row.dataset.type, id = row.dataset.meal;
      if (act === "meal") { const dk = mealDayKey(tKey); S.meals[dk] = S.meals[dk] || {}; S.meals[dk][id] = !S.meals[dk][id]; }
      else { const m = ((dt(tKey) || {}).meals || []).find(x => x.id === id); const n = (m && m.alternatives || []).length; S.swaps[id] = n ? ((S.swaps[id] || 0) + 1) % (n + 1) : 0; }
      save(); refreshNutrition(tKey); return;
    }
    if (act === "dtype") { voedType = el.dataset.k; renderVoeding(); return; }
    if (act === "calcreset") { S.calc = null; save(); renderVoeding(); toast("Profiel hersteld"); return; }
    if (act === "shopreset") { const sh = N.shopping; Object.keys(S.shop).forEach(k => { if (k.indexOf(sh.id + ":") === 0) delete S.shop[k]; }); save(); renderVoeding(); return; }
    if (act === "station") { const id = el.dataset.id, n = +el.dataset.n; S.stations[id] = S.stations[id] === n ? 0 : n; save(); el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.n === S.stations[id])); return; }
    if (act === "wadd") {
      const kg = parseFloat(String($("#wKg").value).replace(",", ".")), d = $("#wDate").value || TODAY_ISO;
      if (!(kg > 20 && kg < 400)) { toast("Vul een geldig gewicht in"); return; }
      S.weights = S.weights.filter(x => x.date !== d); S.weights.push({ date: d, kg: Math.round(kg * 10) / 10 }); save(); renderVoortgang(); toast("Gewicht opgeslagen"); return;
    }
    if (act === "wdel") { S.weights = S.weights.filter(x => x.date !== el.dataset.d); save(); renderVoortgang(); return; }
  });
  function refreshNutrition(tKey) {
    document.querySelectorAll(`[data-rings="${tKey}"]`).forEach(c => { const note = c.querySelector(".note"); c.innerHTML = ringsHTML(tKey); if (note) c.appendChild(note); });
    document.querySelectorAll(`[data-meals="${tKey}"]`).forEach(c => { c.innerHTML = mealsHTML(tKey) + planNotesHTML(tKey); });
  }
  document.querySelector("main").addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.act === "note") { const card = t.closest("[data-sid]"), s = sessions.find(x => x.id === card.dataset.sid); const k = sKey(s); S.log[k] = Object.assign(S.log[k] || {}, { note: t.value }); save(); return; }
    if (t.dataset.calc) { const v = t.dataset.calc === "sex" ? t.value : parseFloat(String(t.value).replace(",", ".")); if (t.dataset.calc === "sex" || !isNaN(v)) { S.calc = Object.assign({}, S.calc || {}, { [t.dataset.calc]: v }); save(); $("#calcRes").innerHTML = calcResHTML(terHaaf(calcInput())); refreshNutrition(voedType); } return; }
    if (t.dataset.body) { S[t.dataset.body] = +t.value; S.bodyDate = TODAY_ISO; save(); const o = $("#" + t.dataset.body + "Val"); o.textContent = t.value; o.style.color = rpeColor(+t.value); return; }
  });
  document.querySelector("main").addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.shop) { if (t.checked) S.shop[t.dataset.shop] = true; else delete S.shop[t.dataset.shop]; save(); const y = window.scrollY; renderVoeding(); window.scrollTo(0, y); return; }
    if (t.dataset.calc === "sex") { S.calc = Object.assign({}, S.calc || {}, { sex: t.value }); save(); $("#calcRes").innerHTML = calcResHTML(terHaaf(calcInput())); refreshNutrition(voedType); }
  });

  renderHeader();
  show(location.hash.slice(1) || "vandaag", true);
})();
</script>
</body>
</html>
